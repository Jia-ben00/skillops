name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 单元测试
        run: npm test
      - name: 一键安装脚本语法检查（install.sh）
        run: sh -n install.sh
      - name: 版本一致性检查（install 脚本默认版本 == package.json，且 src/ 无硬编码版本）
        run: node scripts/check-version-sync.mjs
      - name: 发布包构建自检（tgz/zip 结构）
        run: |
          node scripts/build-release.js
          node -e "const fs=require('fs'),zlib=require('zlib');const r=JSON.parse(fs.readFileSync('dist/release.json','utf8'));const tgz=fs.readFileSync('dist/'+r.package);const t=zlib.gunzipSync(tgz).toString('latin1');if(!t.includes('package/src/cli.js'))process.exit(1);const z=fs.readFileSync('dist/'+r.zip);if(z.readUInt32LE(0)!==0x04034b50)process.exit(1);console.log('release assets ok: '+r.package)"
      - name: SkillOps 团队仓库自检（init → push → gate）
        run: |
          node src/cli.js sync init .team
          node src/cli.js sync push .team --from test/fixtures --apply
          node src/cli.js sync gate .team --local .team/skills --strict
      - name: skill-gate Action 正例（应通过）
        run: node .github/actions/skill-gate/gate.cjs .team/skills .team/.skillops/registry.json true
      - name: skill-gate Action 负例（应失败：版本落后）
        run: |
          node -e "const fs=require('fs');let f='.team/skills/good-skill/SKILL.md';let c=fs.readFileSync(f,'utf8').replace(/^version: .*$/m,'version: 0.0.1');fs.writeFileSync(f,c)"
          if node .github/actions/skill-gate/gate.cjs .team/skills .team/.skillops/registry.json true; then
            echo "::error::门禁应拦截版本落后，却通过了"
            exit 1
          else
            echo "门禁正确拦截版本落后 ✓"
          fi
